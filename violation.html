<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Record Violation | STI</title>
<link rel="stylesheet" href="styles%20(1).css">
<script src="app-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>[x-cloak] { display: none !important; }</style>
</head>
<body>
<div class="app">
<div class="sidebar-backdrop" id="sidebarBackdrop" @click="closeSidebar()">
</div>
<div class="page active" id="page-violation"
		 x-data="{
			 studentSearch: '',
			 existingGuardianEmail: '',
			 categories: [],
			 newStudent: { studentId: '', gender: '', firstName: '', lastName: '', course: 'BSIT', yearLevel: '1st Year', section: 'A', phone: '', parentName: '', parentPhone: '', guardianEmail: '', address: '' },
			 violation: { date: '', action: 'Verbal Warning', notes: '', concern: '' },
			 today: new Date().toISOString().slice(0, 10)
		 }"
		 x-init="if (sessionStorage.getItem('violationMode') === 'new') { $store.violation.mode = 'new'; sessionStorage.removeItem('violationMode'); }">
<div class="shell">
<div class="sidebar" id="sidebar-violation">
</div>
<div class="main">
<div class="topbar" id="topbar-violation">
</div>
<div class="content">
<form id="violationForm" @submit.prevent="handleViolationSave($event)">
<div class="form-card violation-record-section">
<h2>Record Violation</h2>
<div class="mode-toggle">
<button type="button" id="modeBtnExisting" :class="{ active: $store.violation.mode === 'existing' }" @click="setViolationMode('existing')">Existing Student</button>
<button type="button" id="modeBtnNew" :class="{ active: $store.violation.mode === 'new' }" @click="setViolationMode('new')">Add New Student</button>
</div>
<div id="existingStudentBlock" x-cloak x-show="$store.violation.mode === 'existing'">
<div class="form-field">
<label>Search Student</label>
<div class="search" style="width:100%;"><svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="v_studentSearch" x-model="studentSearch" @input="renderViolationSearchResults()" placeholder="Type a name or ID number to search..." autocomplete="off">
</div>
</div>
<div id="v_studentResults" class="card" style="margin:10px 0 16px;padding:8px;max-height:180px;overflow:auto;">
</div>
<input type="hidden" id="v_studentSelect" value="">
<div class="readonly-grid" id="violationReadonly">
</div>
<div class="form-field" style="margin-top:14px;">
<label>Guardian Email (Optional)</label>
<input id="v_existing_guardianEmail" x-model="existingGuardianEmail" type="email" placeholder="Enter guardian email for notifications" autocomplete="email">
</div>
</div>
<div id="newStudentBlock" x-cloak x-show="$store.violation.mode === 'new'">
<div class="helper">Fill in the student's info below.</div>
<div class="form-grid">
<div class="form-field">
<label>Student ID</label>
<input id="v_new_studentId" x-model="newStudent.studentId">
</div>
<div class="form-field">
<label>Gender</label>
<select id="v_new_gender" x-model="newStudent.gender">
<option value="">Select</option>
<option>Male</option>
<option>Female</option>
</select>
</div>
<div class="form-field">
<label>First Name</label>
<input id="v_new_firstName" x-model="newStudent.firstName">
</div>
<div class="form-field">
<label>Last Name</label>
<input id="v_new_lastName" x-model="newStudent.lastName">
</div>
<div class="form-field">
<label>Course</label>
<select id="v_new_course" x-model="newStudent.course">
<option>BSHM</option>
<option>BSIT</option>
<option>BSTM</option>
</select>
</div>
<div class="form-field">
<label>Year Level</label>
<select id="v_new_yearLevel" x-model="newStudent.yearLevel">
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>
</div>
<div class="form-field">
<label>Section</label>
<select id="v_new_section" x-model="newStudent.section">
<option>A</option>
<option>B</option>
<option>C</option>
</select>
</div>
<div class="form-field">
<label>Phone Number</label>
<input id="v_new_phone" x-model="newStudent.phone">
</div>
<div class="form-field">
<label>Parent/Guardian Name</label>
<input id="v_new_parentName" x-model="newStudent.parentName">
</div>
<div class="form-field">
<label>Parent/Guardian Phone</label>
<input id="v_new_parentPhone" x-model="newStudent.parentPhone">
</div>
<div class="form-field">
<label>Guardian Email (optional)</label>
<input id="guardianEmail" x-model="newStudent.guardianEmail" type="email" class="form-control" placeholder="Guardian Email (Optional)" autocomplete="email">
</div>
<div class="form-field" style="grid-column:1/-1">
<label>Address</label>
<input id="v_new_address" x-model="newStudent.address">
</div>
</div>
</div>
<div class="form-field">
<label>Violation(s)</label>
<input id="studentId" type="hidden">
<input id="studentName" type="hidden">
<input id="violationType" type="hidden">
<input id="guardianPhone" type="hidden">
<div class="check-list" id="v_categoryChecks">
<div class="category-heading">MINOR OFFENSES</div>
<label>
<input type="checkbox" value="Dress code and grooming" x-model="categories"> Dress code and grooming</label>
<label>
<input type="checkbox" value="Classroom & campus decorum" x-model="categories"> Classroom &amp; campus decorum</label>
<div class="category-heading">MAJOR OFFENSES</div>
<label>
<input type="checkbox" value="Basic Misconduct & Campus Disturbance" x-model="categories"> Basic Misconduct &amp; Campus Disturbance</label>
<label>
<input type="checkbox" value="Academic Integrity, Smoking, & Vandalism" x-model="categories"> Academic Integrity, Smoking, &amp; Vandalism</label>
<label>
<input type="checkbox" value="Substance Use, Theft, Assault, & Harassment" x-model="categories"> Substance Use, Theft, Assault, &amp; Harassment</label>
<label>
<input type="checkbox" value="Severe Misconduct, Illegal Acts, & Safety Threats" x-model="categories"> Severe Misconduct, Illegal Acts, &amp; Safety Threats</label>
</div>
</div>
<div class="form-grid">
<div class="form-field">
<label>Date</label>
<input id="v_date" x-model="violation.date" :max="today" type="date">
</div>
<div class="form-field">
<label>Action Taken</label>
<select id="v_action" x-model="violation.action">
<option>Verbal Warning</option>
<option>Written Warning</option>
<option>Community Service</option>
<option>Suspension</option>
<option>Scholarship Voided</option>
</select>
</div>
</div>
<div class="form-field">
<label>Notes</label>
<textarea id="v_notes" x-model="violation.notes">
</textarea>
</div>
<div class="form-field" x-cloak x-show="$store.violation.nextCount === 4">
<label for="v_parentConcern">Concern for Parent/Guardian</label>
<textarea id="v_parentConcern" x-model="violation.concern" :required="$store.violation.nextCount === 4" placeholder="Type the concern to send to the parent or guardian"></textarea>
</div>
<div class="form-actions">
<button class="btn gray" type="button" @click="window.showPage('students')">Cancel</button>
<button class="btn gray role-protected-write" type="submit" data-print="true">Save &amp; Print</button>
<button class="btn green role-protected-write" type="submit" data-print="false">Save</button>
</div>
</div>
</form>
</div>
</div>
</div>
</div>
<div id="printArea" class="print-only">
</div>
<script type="module">
	import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
	import { 
		getFirestore, collection, addDoc, getDocs, onSnapshot, doc, getDoc, setDoc, deleteDoc, updateDoc 
	} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

	const firebaseConfig = window.__APP_API_CONFIG__.firebase;
	const app = initializeApp(firebaseConfig);
	const db = getFirestore(app);

	window.db = db;
	window.fs = { collection, addDoc, getDocs, onSnapshot, doc, getDoc, setDoc, deleteDoc, updateDoc };
</script>
<script src="script%20(1).js"></script>
</body>
</html>
